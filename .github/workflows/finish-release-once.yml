name: Finalize public release records
on:
  push:
    paths:
      - '.github/workflows/finish-release-once.yml'
permissions:
  actions: write
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Retain verified application QA and remove obsolete action run records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.name != "NEXTQUESTION hospital research QA" and .name != "Finalize public release records") | .id')"
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null
          done
          echo 'Preserved current research test runs; obsolete workflow runs deleted.'
      - name: Remove temporary release operation from main source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finish-release-once.yml
          git commit -m "Finalize clean NEXTQUESTION source release"
          git push origin HEAD:main
